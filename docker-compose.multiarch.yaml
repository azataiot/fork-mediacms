# Multi-architecture MediaCMS Docker Compose
# Supports: linux/amd64, linux/arm64 (Apple Silicon)
#
# Images (each runs a single process - no supervisord):
#   - azataiot/mediacms-web:latest      - Django + uWSGI + Nginx (API server)
#   - azataiot/mediacms-worker:latest   - Celery worker + FFmpeg + Bento4
#   - azataiot/mediacms-worker:full     - Celery worker + FFmpeg + Bento4 + Whisper
#   - azataiot/mediacms-beat:latest     - Celery Beat scheduler
#   - azataiot/mediacms-frontend:latest - Nginx reverse proxy
#
# Usage:
#   docker compose -f docker-compose.multiarch.yaml up
#
# Or to build locally:
#   docker compose -f docker-compose.multiarch.yaml build
#   docker compose -f docker-compose.multiarch.yaml up

services:
  # PostgreSQL Database
  db:
    image: postgres:17.2-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediacms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediacms}
      POSTGRES_DB: ${POSTGRES_DB:-mediacms}
      TZ: ${TZ:-Europe/London}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediacms-net

  # Redis for caching and Celery broker
  redis:
    image: redis:alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mediacms-net

  # Web server (Django + uWSGI + Nginx) - also handles migrations on first run
  web:
    image: azataiot/mediacms-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    deploy:
      replicas: 1
    volumes:
      - media_files:/home/mediacms.io/mediacms/media_files
    environment:
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost}
      PORTAL_NAME: ${PORTAL_NAME:-MediaCMS}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - mediacms-net

  # Celery Beat scheduler
  beat:
    image: azataiot/mediacms-beat:latest
    build:
      context: .
      dockerfile: Dockerfile.beat
    restart: always
    volumes:
      - media_files:/home/mediacms.io/mediacms/media_files:ro
    depends_on:
      - redis
      - web
    networks:
      - mediacms-net

  # Celery worker (video encoding, HLS, sprites)
  worker:
    image: azataiot/mediacms-worker:latest
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: base
    deploy:
      replicas: 1
    restart: always
    volumes:
      - media_files:/home/mediacms.io/mediacms/media_files
    depends_on:
      - redis
      - web
    networks:
      - mediacms-net

  # Frontend (Nginx reverse proxy)
  frontend:
    image: azataiot/mediacms-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - web
    networks:
      - mediacms-net

volumes:
  postgres_data:
  media_files:

networks:
  mediacms-net:
    driver: bridge
