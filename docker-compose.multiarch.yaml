# Multi-architecture MediaCMS Docker Compose
# Supports: linux/amd64, linux/arm64 (Apple Silicon)
#
# Image variants:
#   - azataiot/mediacms-backend:lite   - Django only (web, celery_beat, migrations)
#   - azataiot/mediacms-backend:latest - Django + FFmpeg + Bento4 (celery workers)
#   - azataiot/mediacms-backend:full   - Django + FFmpeg + Bento4 + Whisper
#   - azataiot/mediacms-frontend:latest - Nginx frontend
#
# Usage:
#   docker compose -f docker-compose.multiarch.yaml up
#
# Or to build locally:
#   docker compose -f docker-compose.multiarch.yaml build
#   docker compose -f docker-compose.multiarch.yaml up

version: "3.8"

services:
  # Database
  db:
    image: postgres:17.2-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediacms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediacms}
      POSTGRES_DB: ${POSTGRES_DB:-mediacms}
      TZ: ${TZ:-Europe/London}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediacms-net

  # Redis for caching and Celery broker
  redis:
    image: redis:alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mediacms-net

  # Migrations job (runs once) - uses lite image (no FFmpeg needed)
  migrations:
    image: azataiot/mediacms-backend:lite
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: base-lite
    volumes:
      - media_files:/home/mediacms.io/mediacms/media_files
      - static_files:/home/mediacms.io/mediacms/static
    environment:
      ENABLE_UWSGI: 'no'
      ENABLE_NGINX: 'no'
      ENABLE_CELERY_SHORT: 'no'
      ENABLE_CELERY_LONG: 'no'
      ENABLE_CELERY_BEAT: 'no'
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost}
      PORTAL_NAME: ${PORTAL_NAME:-MediaCMS}
    command: "./deploy/docker/prestart.sh"
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - mediacms-net

  # Backend API server - uses lite image (no FFmpeg needed for API)
  backend:
    image: azataiot/mediacms-backend:lite
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: base-lite
    deploy:
      replicas: 1
    volumes:
      - media_files:/home/mediacms.io/mediacms/media_files
      - static_files:/home/mediacms.io/mediacms/static
    environment:
      ENABLE_CELERY_BEAT: 'no'
      ENABLE_CELERY_SHORT: 'no'
      ENABLE_CELERY_LONG: 'no'
      ENABLE_MIGRATIONS: 'no'
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost}
      PORTAL_NAME: ${PORTAL_NAME:-MediaCMS}
    depends_on:
      - migrations
    networks:
      - mediacms-net

  # Celery Beat scheduler - uses lite image (just scheduling, no encoding)
  celery_beat:
    image: azataiot/mediacms-backend:lite
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: base-lite
    volumes:
      - media_files:/home/mediacms.io/mediacms/media_files
    environment:
      ENABLE_UWSGI: 'no'
      ENABLE_NGINX: 'no'
      ENABLE_CELERY_SHORT: 'no'
      ENABLE_CELERY_LONG: 'no'
      ENABLE_MIGRATIONS: 'no'
    depends_on:
      - redis
      - migrations
    networks:
      - mediacms-net

  # Celery worker - uses FULL image with FFmpeg + Bento4 for encoding tasks
  celery_worker:
    image: azataiot/mediacms-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: base
    deploy:
      replicas: 1
    volumes:
      - media_files:/home/mediacms.io/mediacms/media_files
    environment:
      ENABLE_UWSGI: 'no'
      ENABLE_NGINX: 'no'
      ENABLE_CELERY_BEAT: 'no'
      ENABLE_MIGRATIONS: 'no'
    depends_on:
      - migrations
    networks:
      - mediacms-net

  # Frontend (nginx serving static + reverse proxy)
  frontend:
    image: azataiot/mediacms-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    volumes:
      - static_files:/usr/share/nginx/html/static:ro
    depends_on:
      - backend
    networks:
      - mediacms-net

volumes:
  postgres_data:
  media_files:
  static_files:

networks:
  mediacms-net:
    driver: bridge
